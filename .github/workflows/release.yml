# Cuts a GitHub Release and attaches coax.html to it — nothing to build,
# since the whole app is that one file, so this workflow mostly exists to make
# "download coax.html" attach to a Release page rather than a bare repo file.
#
# Triggered by pushing a version tag:
#
#   git tag v1.0.0 ; git push origin v1.0.0
#
# Can also be run by hand from the Actions tab (workflow_dispatch) to sanity
# check the version-match step without cutting a release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload the asset

jobs:
  release:
    name: Release coax.html
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The version lives in coax.html, not in the tag — the tag is just how
      # a release gets cut. Read it so the release title matches what the
      # app itself reports (the small "vX.Y.Z" next to the COAX brand).
      - name: Read version from coax.html
        id: ver
        run: |
          VERSION=$(grep -oPm1 '(?<=const APP_VERSION = ")[^"]+' coax.html)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing COAX $VERSION"

      # Fail loudly if the tag and the declared version disagree, rather than
      # publishing a v1.1.0 release containing a file that says 1.0.0.
      - name: Check the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag v$TAG does not match APP_VERSION \"${{ steps.ver.outputs.version }}\" in coax.html"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: coax.html
          path: coax.html
          retention-days: 14

      # Only on a tag. A manual run stops here, so the version check can be
      # tested without publishing anything.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Create the release if it doesn't exist yet, so pushing the tag first
          # and writing notes later both work.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "COAX ${{ steps.ver.outputs.version }}" --generate-notes
          gh release upload "$TAG" coax.html --clobber
